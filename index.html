<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grimório de Seeds — RPG</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --gold:#c8973a;--gold-dim:#8a6020;--gold-bright:#f0c860;
      --ink:#0a0806;--parchment:#e8d5b0;--parchment-dim:#9a8060;
      --surface:rgba(255,255,255,0.03);--border:rgba(200,151,58,0.2);
      --unlocked:#40c080;--green:#40c080;--red:#c06040;
    }
    body{background:var(--ink);color:var(--parchment);font-family:'Crimson Pro',Georgia,serif;min-height:100vh}
    .app{min-height:100vh;background:radial-gradient(ellipse at 15% 5%,rgba(139,69,19,.18) 0%,transparent 45%),radial-gradient(ellipse at 85% 95%,rgba(100,60,20,.14) 0%,transparent 45%),var(--ink);padding:2.5rem 1.5rem 6rem}
    .container{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:1.6rem}
    .header{text-align:center;margin-bottom:1rem}
    h1{font-family:'Cinzel Decorative',serif;font-size:clamp(1.5rem,4vw,2.2rem);color:var(--gold);letter-spacing:.05em;text-shadow:0 0 40px rgba(200,151,58,.25)}
    .subtitle{font-style:italic;color:var(--parchment-dim);font-size:.98rem;margin-top:.4rem}

    /* ── MODAL OVERLAY ── */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem;animation:fadeIn .2s ease}
    .modal{background:#110d08;border:1px solid rgba(200,151,58,.35);border-radius:8px;padding:2.5rem;width:100%;max-width:540px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.7)}
    .modal::before{content:'';position:absolute;inset:0;border-radius:8px;background:radial-gradient(ellipse at 50% 0%,rgba(200,151,58,.08) 0%,transparent 60%);pointer-events:none}
    .modal-title{font-family:'Cinzel Decorative',serif;font-size:1rem;color:var(--gold);letter-spacing:.08em;margin-bottom:.4rem}
    .modal-sub{font-style:italic;color:var(--parchment-dim);font-size:.9rem;margin-bottom:1.8rem;line-height:1.5}
    .modal-section{margin-bottom:1.4rem}
    .modal-section-title{font-family:'Cinzel Decorative',serif;font-size:.6rem;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin-bottom:.6rem;display:flex;align-items:center;gap:.5rem}
    .modal-section-title::after{content:'';flex:1;height:1px;background:linear-gradient(to right,rgba(200,151,58,.3),transparent)}
    .field-row{display:flex;flex-direction:column;gap:.35rem;margin-bottom:.8rem}
    .field-label{font-size:.8rem;color:var(--parchment-dim)}
    .field-input{background:rgba(0,0,0,.4);border:1px solid rgba(200,151,58,.22);border-radius:4px;padding:.55rem .8rem;font-family:'Crimson Pro',serif;font-size:.95rem;color:var(--parchment);outline:none;transition:border-color .2s;width:100%}
    .field-input::placeholder{color:#4a3a25;font-style:italic}
    .field-input:focus{border-color:rgba(200,151,58,.5)}
    .field-hint{font-size:.75rem;color:#5a4a30;font-style:italic}
    .field-hint a{color:var(--gold);text-decoration:none}
    .modal-actions{display:flex;gap:.6rem;margin-top:1.6rem;flex-wrap:wrap}
    .status-row{display:flex;align-items:center;gap:.5rem;font-size:.82rem;margin-top:.3rem}
    .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .dot.ok{background:var(--green)}
    .dot.warn{background:#c8973a}
    .dot.off{background:#804030}

    /* ── TOPBAR ── */
    .topbar{display:flex;align-items:center;gap:.8rem;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.65rem 1rem;flex-wrap:wrap}
    .topbar-provider{display:flex;gap:.4rem}
    .prov-btn{background:transparent;border:1px solid rgba(200,151,58,.2);border-radius:4px;padding:.3rem .8rem;font-family:'Crimson Pro',serif;font-size:.85rem;color:var(--parchment-dim);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:.3rem}
    .prov-btn:hover{border-color:rgba(200,151,58,.45);color:var(--parchment)}
    .prov-btn.active{background:rgba(200,151,58,.16);border-color:var(--gold);color:var(--gold-bright)}
    .prov-btn:disabled{opacity:.35;cursor:not-allowed}
    .topbar-sep{width:1px;height:24px;background:rgba(200,151,58,.2);flex-shrink:0}
    .sync-status{font-size:.78rem;font-style:italic;display:flex;align-items:center;gap:.35rem;margin-left:auto}
    .sync-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
    .sync-dot.synced{background:var(--green)}
    .sync-dot.syncing{background:var(--gold);animation:pulse .8s infinite}
    .sync-dot.local{background:#c8973a}
    .sync-dot.error{background:var(--red)}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .btn-settings{background:transparent;border:1px solid rgba(200,151,58,.18);border-radius:4px;padding:.3rem .65rem;font-size:.8rem;color:#7a6a50;cursor:pointer;transition:all .2s;margin-left:.2rem}
    .btn-settings:hover{border-color:rgba(200,151,58,.4);color:var(--gold)}

    /* ── TABS ── */
    .nav-tabs{display:flex;border-bottom:1px solid var(--border)}
    .nav-tab{background:transparent;border:none;border-bottom:2px solid transparent;padding:.55rem 1.2rem;font-family:'Cinzel Decorative',serif;font-size:.6rem;letter-spacing:.12em;color:var(--parchment-dim);cursor:pointer;transition:all .2s;text-transform:uppercase;position:relative;bottom:-1px}
    .nav-tab:hover{color:var(--gold)}
    .nav-tab.active{color:var(--gold-bright);border-bottom-color:var(--gold)}
    .badge-count{background:rgba(200,151,58,.2);border-radius:10px;padding:0 .35rem;font-size:.58rem;margin-left:.3rem;color:var(--gold)}

    /* ── SECTIONS ── */
    .section{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:1.8rem 2rem}
    .section-title{font-family:'Cinzel Decorative',serif;font-size:.68rem;letter-spacing:.15em;color:var(--gold);text-transform:uppercase;margin-bottom:1.2rem;display:flex;align-items:center;gap:.6rem}
    .section-title::after{content:'';flex:1;height:1px;background:linear-gradient(to right,rgba(200,151,58,.35),transparent)}

    /* ── CHIPS / TAGS ── */
    .chip-grid{display:flex;flex-wrap:wrap;gap:.6rem .75rem}
    .chip{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:.45rem 1rem;font-family:'Crimson Pro',serif;font-size:.93rem;color:var(--parchment-dim);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:.4rem;white-space:nowrap}
    .chip:hover{border-color:rgba(200,151,58,.55);color:var(--parchment);background:rgba(200,151,58,.07);transform:translateY(-1px)}
    .chip.active{background:rgba(200,151,58,.17);border-color:var(--gold);color:var(--gold-bright);box-shadow:0 2px 10px rgba(200,151,58,.22)}
    .chip.unlocked{border-color:rgba(64,192,128,.45)}
    .chip .unlock-dot{width:5px;height:5px;border-radius:50%;background:var(--unlocked);display:inline-block;flex-shrink:0}
    .chip .use-count{font-size:.65rem;opacity:.45;margin-left:.2rem}
    .chip.new-anim{animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}
    @keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}

    .tag-grid{display:flex;flex-wrap:wrap;gap:.45rem .6rem}
    .tag{background:var(--surface);border:1px solid rgba(150,110,50,.25);border-radius:20px;padding:.32rem .9rem;font-size:.88rem;color:#8a7255;cursor:pointer;transition:all .15s;white-space:nowrap}
    .tag:hover{border-color:rgba(200,151,58,.4);color:#c8a860;transform:translateY(-1px)}
    .tag.active{background:rgba(180,100,30,.2);border-color:#a87830;color:var(--gold-bright)}
    .tag.unlocked{border-color:rgba(64,192,128,.38)}
    .tag.new-anim{animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}

    /* ── ESCOPO ── */
    .escopo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
    .escopo-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:1.2rem .9rem;cursor:pointer;transition:all .2s;text-align:center}
    .escopo-card:hover{border-color:rgba(200,151,58,.5);background:rgba(200,151,58,.07);transform:translateY(-1px)}
    .escopo-card.active{background:rgba(200,151,58,.15);border-color:var(--gold);box-shadow:0 3px 14px rgba(200,151,58,.2)}
    .escopo-icon{font-size:1.6rem;margin-bottom:.35rem}
    .escopo-label{font-family:'Cinzel Decorative',serif;font-size:.68rem;color:var(--gold);display:block;margin-bottom:.25rem;font-weight:700}
    .escopo-desc{font-style:italic;font-size:.82rem;color:#7a6a50}

    /* ── BUTTONS ── */
    .btn{border-radius:4px;font-family:'Crimson Pro',serif;cursor:pointer;transition:all .2s;border:1px solid;font-weight:600}
    .btn-primary{background:linear-gradient(135deg,#6b3010,#c8973a,#6b3010);background-size:200% 100%;border-color:var(--gold);padding:1rem 3.2rem;font-family:'Cinzel Decorative',serif;font-size:.95rem;color:#fef0c8;letter-spacing:.1em;box-shadow:0 4px 20px rgba(200,151,58,.18),inset 0 1px 0 rgba(255,255,255,.08);position:relative;overflow:hidden}
    .btn-primary:hover:not(:disabled){background-position:right center;box-shadow:0 6px 35px rgba(200,151,58,.4);transform:translateY(-1px)}
    .btn-primary:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .btn-primary.loading::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 25%,rgba(255,255,255,.15) 50%,transparent 75%);background-size:200% 100%;animation:shimmer 1.2s infinite}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    .btn-ghost{background:transparent;border-color:rgba(200,151,58,.2);padding:.45rem 1.1rem;font-size:.88rem;color:#7a6a50}
    .btn-ghost:hover{border-color:rgba(200,151,58,.45);color:var(--gold);background:rgba(200,151,58,.05)}
    .btn-ingest{background:rgba(200,151,58,.12);border-color:rgba(200,151,58,.35);padding:.45rem 1.1rem;font-size:.88rem;color:var(--gold)}
    .btn-ingest:hover:not(:disabled){background:rgba(200,151,58,.22);transform:translateY(-1px)}
    .btn-ingest:disabled{opacity:.4;cursor:not-allowed}
    .btn-danger{background:transparent;border-color:rgba(192,96,64,.3);color:#c06040}
    .btn-danger:hover{background:rgba(192,64,40,.1);border-color:rgba(192,96,64,.5)}

    /* ── RESULT ── */
    .generate-area{text-align:center;padding:1.2rem 0;margin-top:.5rem}
    .unlock-notice{background:rgba(64,192,128,.08);border:1px solid rgba(64,192,128,.3);border-radius:5px;padding:.75rem 1rem;font-size:.88rem;color:#60d090;display:flex;align-items:flex-start;gap:.5rem;animation:fadeSlide .4s ease}
    @keyframes fadeSlide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
    .result-box{background:rgba(8,4,2,.92);border:1px solid rgba(200,151,58,.35);border-radius:6px;padding:3rem 4rem;position:relative;animation:fadeIn .5s ease;box-shadow:0 8px 30px rgba(0,0,0,.5);margin-top:1rem}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .result-box::before{content:'';position:absolute;inset:0;border-radius:6px;background:radial-gradient(ellipse at 50% 0%,rgba(200,151,58,.07) 0%,transparent 65%);pointer-events:none}
    .result-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.8rem;padding-bottom:1rem;border-bottom:1px solid rgba(200,151,58,.22);flex-wrap:wrap;gap:.6rem}
    .result-label{font-family:'Cinzel Decorative',serif;font-size:.65rem;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;font-weight:700}
    .result-badges{display:flex;gap:.4rem;flex-wrap:wrap}
    .badge{background:rgba(200,151,58,.1);border:1px solid rgba(200,151,58,.28);border-radius:3px;padding:.15rem .5rem;font-size:.72rem;color:#c8973a;font-style:italic;font-weight:600}
    .result-content{font-size:1.15rem;line-height:2;color:#e3d5b8}
    .grimorio-bullet-container{display:flex !important;align-items:flex-start !important;gap:1.2rem !important;margin-bottom:1.5rem !important}
    .grimorio-bullet-marker{color:var(--gold) !important;font-size:.85rem !important;line-height:2 !important;flex-shrink:0 !important;user-select:none}
    .grimorio-bullet-text{flex:1 !important;text-align:justify !important;line-height:2 !important;color:#e3d5b8 !important}
    .result-actions{display:flex;gap:.5rem;margin-top:2.5rem;padding-top:1rem;border-top:1px solid rgba(200,151,58,.18);flex-wrap:wrap}

    /* ── IDEA ── */
    .idea-area{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:1.8rem 2rem}
    .idea-textarea{width:100%;background:rgba(0,0,0,.4);border:1px solid rgba(200,151,58,.25);border-radius:4px;padding:1rem;font-family:'Crimson Pro',serif;font-size:1.05rem;color:var(--parchment);resize:vertical;min-height:110px;outline:none;transition:border-color .2s;line-height:1.6}
    .idea-textarea::placeholder{color:#5a4528;font-style:italic}
    .idea-textarea:focus{border-color:rgba(200,151,58,.5)}
    .idea-hint{font-size:.85rem;font-style:italic;color:#735c3a;margin-top:.6rem;font-weight:600}
    .idea-actions{display:flex;gap:.5rem;margin-top:1.2rem;flex-wrap:wrap;align-items:center}
    .idea-quick-btn{background:rgba(200,151,58,.1);border:1px solid rgba(200,151,58,.25);border-radius:4px;padding:.35rem .8rem;font-size:.85rem;color:var(--gold-bright);cursor:pointer;transition:all .15s;font-family:'Crimson Pro',serif;font-weight:600}
    .idea-quick-btn:hover{background:rgba(200,151,58,.2);border-color:var(--gold)}
    .ingested-preview{background:rgba(200,151,58,.04);border:1px dashed rgba(200,151,58,.35);border-radius:5px;padding:1.4rem;margin-top:2rem;animation:fadeSlide .3s ease}
    .ingested-title{font-family:'Cinzel Decorative',serif;font-size:.65rem;letter-spacing:.15em;color:var(--gold);text-transform:uppercase;margin-bottom:1rem;font-weight:700}
    .ingested-items{display:flex;flex-wrap:wrap;gap:.6rem}

    /* ── HISTORY ── */
    .history-list{display:flex;flex-direction:column;gap:1rem}
    .history-item{background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:1.2rem 1.4rem;cursor:pointer;transition:all .2s}
    .history-item:hover{border-color:rgba(200,151,58,.4);background:rgba(200,151,58,.05)}
    .history-meta{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.5rem}
    .history-preview{font-size:.93rem;color:var(--parchment-dim);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .history-date{font-size:.78rem;color:#5a4a30;margin-top:.4rem}

    /* ── STATS ── */
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1rem}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:1.2rem;text-align:center}
    .stat-num{font-family:'Cinzel Decorative',serif;font-size:1.75rem;color:var(--gold)}
    .stat-label{font-size:.82rem;color:var(--parchment-dim);font-style:italic;margin-top:.3rem}
    .empty-state{text-align:center;padding:4rem 2rem;color:var(--parchment-dim);font-style:italic;font-size:1.05rem}
    .error-msg{color:var(--red);font-style:italic;text-align:center;padding:1rem}
    @media(max-width:768px){.escopo-grid{grid-template-columns:1fr}.result-box{padding:2rem 1.5rem}.app{padding:1.5rem 1rem 4rem}.section{padding:1.3rem 1.1rem}.modal{padding:1.8rem}}

    /* ── MUNDOS / WORLDS TAB ── */
    .world-active-bar{background:rgba(200,151,58,.07);border:1px solid rgba(200,151,58,.28);border-radius:6px;padding:.8rem 1.2rem;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
    .world-active-label{font-family:'Cinzel Decorative',serif;font-size:.58rem;letter-spacing:.15em;color:var(--gold);text-transform:uppercase;white-space:nowrap}
    .world-name-display{font-size:1.05rem;color:var(--parchment);font-weight:600;flex:1}
    .world-name-display em{font-style:italic;color:var(--parchment-dim);font-size:.9rem;font-weight:normal}
    .world-list{display:flex;flex-direction:column;gap:.75rem}
    .world-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:1.1rem 1.4rem;cursor:pointer;transition:all .2s;display:flex;align-items:flex-start;gap:1rem}
    .world-card:hover{border-color:rgba(200,151,58,.45);background:rgba(200,151,58,.05)}
    .world-card.active-world{border-color:var(--gold);background:rgba(200,151,58,.1);box-shadow:0 0 16px rgba(200,151,58,.12)}
    .world-card-info{flex:1;min-width:0}
    .world-card-name{font-family:'Cinzel Decorative',serif;font-size:.82rem;color:var(--gold-bright);margin-bottom:.25rem;letter-spacing:.04em}
    .world-card-desc{font-size:.88rem;color:var(--parchment-dim);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .world-card-meta{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.45rem}
    .world-pill{background:rgba(200,151,58,.1);border:1px solid rgba(200,151,58,.22);border-radius:10px;padding:.08rem .5rem;font-size:.68rem;color:#a8803a}
    .world-card-actions{display:flex;gap:.35rem;flex-shrink:0}
    .world-edit-form{background:rgba(8,4,2,.7);border:1px solid rgba(200,151,58,.3);border-radius:8px;padding:1.8rem 2rem;display:flex;flex-direction:column;gap:1.2rem;animation:fadeIn .3s ease}
    .wf-row{display:flex;flex-direction:column;gap:.35rem}
    .wf-label{font-family:'Cinzel Decorative',serif;font-size:.58rem;letter-spacing:.15em;color:var(--gold);text-transform:uppercase}
    .wf-input{background:rgba(0,0,0,.4);border:1px solid rgba(200,151,58,.22);border-radius:4px;padding:.6rem .85rem;font-family:'Crimson Pro',serif;font-size:.95rem;color:var(--parchment);outline:none;transition:border-color .2s;width:100%}
    .wf-input:focus{border-color:rgba(200,151,58,.5)}
    .wf-input::placeholder{color:#4a3a25;font-style:italic}
    .wf-textarea{background:rgba(0,0,0,.4);border:1px solid rgba(200,151,58,.22);border-radius:4px;padding:.75rem .85rem;font-family:'Crimson Pro',serif;font-size:.93rem;color:var(--parchment);outline:none;transition:border-color .2s;width:100%;resize:vertical;line-height:1.6}
    .wf-textarea:focus{border-color:rgba(200,151,58,.5)}
    .wf-textarea::placeholder{color:#4a3a25;font-style:italic}
    .wf-hint{font-size:.76rem;font-style:italic;color:#5a4a30}
    .wf-grid{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
    .wf-section-label{font-family:'Cinzel Decorative',serif;font-size:.55rem;letter-spacing:.18em;color:var(--gold-dim);text-transform:uppercase;margin-top:.3rem;padding-top:.9rem;border-top:1px solid rgba(200,151,58,.15);display:flex;align-items:center;gap:.5rem}
    .wf-section-label::after{content:'';flex:1;height:1px;background:linear-gradient(to right,rgba(200,151,58,.2),transparent)}
    .world-ingest-area{background:rgba(200,151,58,.04);border:1px dashed rgba(200,151,58,.28);border-radius:6px;padding:1.4rem;display:flex;flex-direction:column;gap:.85rem}
    .world-ingest-title{font-family:'Cinzel Decorative',serif;font-size:.6rem;letter-spacing:.15em;color:var(--gold);text-transform:uppercase;display:flex;align-items:center;gap:.5rem}
    .world-ingest-title::after{content:'';flex:1;height:1px;background:linear-gradient(to right,rgba(200,151,58,.25),transparent)}
    .world-seed-banner{background:rgba(200,151,58,.08);border:1px solid rgba(200,151,58,.3);border-radius:5px;padding:.65rem 1rem;font-size:.88rem;color:var(--gold-bright);display:flex;align-items:center;gap:.6rem}
    .world-seed-banner strong{color:var(--gold)}
    @media(max-width:768px){.wf-grid{grid-template-columns:1fr}}

    /* ── GIST KEY BANNER ── */
    .gist-key-banner{background:rgba(64,192,128,.06);border:1px solid rgba(64,192,128,.2);border-radius:5px;padding:.55rem .9rem;font-size:.8rem;color:#50b870;display:flex;align-items:center;gap:.5rem;margin-top:.4rem}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ── DEFAULTS ──────────────────────────────────────────────────────────────
    const DEFAULT_TEMAS = [
      { id:"fantasia", label:"Fantasia Medieval", icon:"⚔️", uses:0 },
      { id:"horror", label:"Horror Cósmico", icon:"💀", uses:0 },
      { id:"sci-fi", label:"Sci-Fi Espacial", icon:"🚀", uses:0 },
      { id:"cyberpunk", label:"Cyberpunk", icon:"🤖", uses:0 },

    // ── LOCAL STORAGE ─────────────────────────────────────────────────────────
    function lsGet(key, fallback) {
      try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
      catch { return fallback; }
    }
    function lsSet(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }
    function loadCfg() { return lsGet(CFG_KEY, { anthropicKey:"", deepseekKey:"", githubToken:"", gistId:"", provider:"deepseek", contextoRico:true }); }
    function saveCfg(cfg) { lsSet(CFG_KEY, cfg); }

    // ── GITHUB GIST SYNC ──────────────────────────────────────────────────────
    const GIST_FILENAME = "grimorio-seeds-data.json";

    async function gistRead(token, gistId) {
      const r = await fetch(`https://api.github.com/gists/${gistId}`, {
        headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" }
      });
      if (!r.ok) throw new Error("Gist não encontrado ou token inválido");
      const data = await r.json();
      const content = data.files?.[GIST_FILENAME]?.content;
      if (!content) throw new Error("Arquivo não encontrado no Gist");
      return JSON.parse(content);
    }

    async function gistWrite(token, gistId, payload) {
      const body = { files: { [GIST_FILENAME]: { content: JSON.stringify(payload, null, 2) } } };
      const r = await fetch(`https://api.github.com/gists/${gistId}`, {
        method: "PATCH",
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json", Accept: "application/vnd.github+json" },
        body: JSON.stringify(body)
      });
      if (!r.ok) throw new Error("Falha ao salvar no Gist");
    }

    async function gistCreate(token) {
      const body = {
        description: "Grimório de Seeds — RPG Data",
        public: false,
        files: { [GIST_FILENAME]: { content: JSON.stringify({ temas: DEFAULT_TEMAS, cenarios: DEFAULT_CENARIOS, tags: DEFAULT_TAGS, historico: [] }, null, 2) } }
      };
      const r = await fetch("https://api.github.com/gists", {
        method: "POST",
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json", Accept: "application/vnd.github+json" },
        body: JSON.stringify(body)
      });
      if (!r.ok) throw new Error("Falha ao criar Gist");
      const data = await r.json();
      return data.id;
    }

    // ── MAIN APP ──────────────────────────────────────────────────────────────
    function App() {
      const [cfg, setCfg] = useState(() => loadCfg());
      const [showSettings, setShowSettings] = useState(false);
      const isFirstRun = !cfg.anthropicKey && !cfg.deepseekKey;

      const [tab, setTab] = useState("gerar");
      const [provider, setProvider] = useState(cfg.provider || "deepseek");

      const [temas, setTemas] = useState(() => lsGet(STORAGE_KEYS.temas, DEFAULT_TEMAS));
      const [cenarios, setCenarios] = useState(() => lsGet(STORAGE_KEYS.cenarios, DEFAULT_CENARIOS));
      const [tags, setTags] = useState(() => lsGet(STORAGE_KEYS.tags, DEFAULT_TAGS));
      const [historico, setHistorico] = useState(() => lsGet(STORAGE_KEYS.historico, []));

      // ── MUNDOS state ──────────────────────────────────────────────────────────
      const [mundos, setMundos] = useState(() => lsGet(STORAGE_KEYS.mundos, []));
      const [activeMundoId, setActiveMundoId] = useState(() => lsGet(STORAGE_KEYS.activeMundo, null));
      const [editingMundo, setEditingMundo] = useState(null);
      const [isNewMundo, setIsNewMundo] = useState(false);
      const [mundoIngestText, setMundoIngestText] = useState("");
      const [mundoIngestLoading, setMundoIngestLoading] = useState(false);
      const [mundoIngestResult, setMundoIngestResult] = useState(null);

      const activeMundo = mundos.find(m => m.id === activeMundoId) || null;

      const updateMundos = (v) => { setMundos(v); lsSet(STORAGE_KEYS.mundos, v); };
      const setActiveMundoAndSave = (id) => { setActiveMundoId(id); lsSet(STORAGE_KEYS.activeMundo, id); };

      const saveMundo = (m) => {
        if (!m.nome.trim()) return;
        if (isNewMundo) {
          updateMundos([...mundos, m]);
        } else {
          updateMundos(mundos.map(x => x.id === m.id ? m : x));
        }
        setEditingMundo(null); setIsNewMundo(false);
      };

      const deleteMundo = (id) => {
        if (!confirm("Apagar este mundo permanentemente?")) return;
        const updated = mundos.filter(m => m.id !== id);
        updateMundos(updated);
        if (activeMundoId === id) setActiveMundoAndSave(null);
      };

      const ingestIntoMundo = async () => {
        if (!mundoIngestText.trim() || !activeMundo) return;
        setMundoIngestLoading(true); setMundoIngestResult(null);
        const prompt = `Você é um assistente de worldbuilding para RPG. O mestre compartilhou informações sobre seu mundo. Extraia e organize essas informações nas categorias abaixo e retorne APENAS JSON válido, sem markdown:

{"lore":"lore e história extraída (adicione ao existente se houver)","locais":"locais e regiões extraídos","faccoes":"facções e organizações extraídas","npcs":"NPCs importantes extraídos","restricoes":"restrições do mundo extraídas (sem magia, tecnologia, etc)","resumo":"1 frase resumindo a nova informação adicionada"}

Mundo atual — ${activeMundo.nome}:
${activeMundo.descricao ? "Descrição: "+activeMundo.descricao : ""}
${activeMundo.lore ? "Lore atual: "+activeMundo.lore.slice(0,400) : ""}
${activeMundo.locais ? "Locais atuais: "+activeMundo.locais.slice(0,300) : ""}
${activeMundo.faccoes ? "Facções atuais: "+activeMundo.faccoes.slice(0,300) : ""}
${activeMundo.npcs ? "NPCs atuais: "+activeMundo.npcs.slice(0,300) : ""}
${activeMundo.restricoes ? "Restrições atuais: "+activeMundo.restricoes.slice(0,200) : ""}

Nova informação a incorporar:
"${mundoIngestText}"

Funda com o que já existe (não apague, expanda). Se uma categoria não tiver informação nova, retorne string vazia "".`;
        try {
          const res = await callAI(prompt, 1200);
          const parsed = JSON.parse(res.replace(/```json|```/g,"").trim());
          setMundoIngestResult(parsed);
        } catch(e) {
          setMundoIngestResult({ _error: e.message });
        }
        setMundoIngestLoading(false);
      };

      const applyMundoIngest = () => {
        if (!mundoIngestResult || mundoIngestResult._error || !activeMundo) return;
        const updated = {
          ...activeMundo,
          lore: [activeMundo.lore, mundoIngestResult.lore].filter(Boolean).join("\n").trim(),
          locais: [activeMundo.locais, mundoIngestResult.locais].filter(Boolean).join("\n").trim(),
          faccoes: [activeMundo.faccoes, mundoIngestResult.faccoes].filter(Boolean).join("\n").trim(),
          npcs: [activeMundo.npcs, mundoIngestResult.npcs].filter(Boolean).join("\n").trim(),
          restricoes: [activeMundo.restricoes, mundoIngestResult.restricoes].filter(Boolean).join("\n").trim(),
        };
        updateMundos(mundos.map(m => m.id === updated.id ? updated : m));
        setMundoIngestText(""); setMundoIngestResult(null);
      };

      // ── FIM MUNDOS ────────────────────────────────────────────────────────────

      const [tema, setTema] = useState(null);
      const [cenario, setCenario] = useState(null);
      const [escopo, setEscopo] = useState(null);
      const [activeTags, setActiveTags] = useState([]);
      const [dica, setDica] = useState("");
      const [ideiaCrua, setIdeiaCrua] = useState("");
      const [ideiaExtraindo, setIdeiaExtraindo] = useState(false);
      const [ideiaExtraida, setIdeiaExtraida] = useState(null);
      const [ideiaConfirmados, setIdeiaConfirmados] = useState([]);

      const [loading, setLoading] = useState(false);
      const [resultado, setResultado] = useState(null);
      const [sugestoes, setSugestoes] = useState(null);
      const [justUnlocked, setJustUnlocked] = useState(null);

      const [syncStatus, setSyncStatus] = useState("local");
      const [syncMsg, setSyncMsg] = useState("");
      const syncRef = useRef(null);

      // Load from Gist on startup
      useEffect(() => {
        if (cfg.githubToken && cfg.gistId) { syncFromGist(); }
      }, []);

      const syncFromGist = async () => {
        if (!cfg.githubToken || !cfg.gistId) return;
        setSyncStatus("syncing");
        try {
          const data = await gistRead(cfg.githubToken, cfg.gistId);
          if (data.temas) { setTemas(data.temas); lsSet(STORAGE_KEYS.temas, data.temas); }
          if (data.cenarios) { setCenarios(data.cenarios); lsSet(STORAGE_KEYS.cenarios, data.cenarios); }
          if (data.tags) { setTags(data.tags); lsSet(STORAGE_KEYS.tags, data.tags); }
          if (data.historico) { setHistorico(data.historico); lsSet(STORAGE_KEYS.historico, data.historico); }
          if (data.mundos) { setMundos(data.mundos); lsSet(STORAGE_KEYS.mundos, data.mundos); }
          // ── PATCH: restore AI keys from Gist ──────────────────────────────
          if (data.apiKeys) {
            const current = loadCfg();
            // Only restore keys that are missing locally — don't overwrite if user just typed new ones
            const merged = {
              ...current,
              anthropicKey: current.anthropicKey || data.apiKeys.anthropicKey || '',
              deepseekKey: current.deepseekKey || data.apiKeys.deepseekKey || '',
              provider: current.provider || data.apiKeys.provider || 'deepseek',
              contextoRico: current.contextoRico !== undefined ? current.contextoRico : (data.apiKeys.contextoRico !== false),
            };
            saveCfg(merged);
            setCfg(merged);
            setProvider(merged.provider);
          }
          // ─────────────────────────────────────────────────────────────────
          setSyncStatus("synced");
          setSyncMsg(data.apiKeys ? "Sincronizado ✦ chaves restauradas" : "Sincronizado");
        } catch(e) {
          setSyncStatus("error"); setSyncMsg("Erro: " + e.message);
        }
      };

      const syncToGist = useCallback(async (tObj, cObj, tgObj, hObj, mObj) => {
        const c = loadCfg();
        if (!c.githubToken || !c.gistId) return;
        setSyncStatus("syncing");
        try {
          // ── PATCH: include AI keys in Gist payload ────────────────────────
          await gistWrite(c.githubToken, c.gistId, {
            temas: tObj,
            cenarios: cObj,
            tags: tgObj,
            historico: hObj,
            mundos: mObj,
            apiKeys: {
              anthropicKey: c.anthropicKey || '',
              deepseekKey: c.deepseekKey || '',
              provider: c.provider || 'deepseek',
              contextoRico: c.contextoRico !== false,
            }
          });
          // ─────────────────────────────────────────────────────────────────
          setSyncStatus("synced"); setSyncMsg("Salvo no Gist");
        } catch(e) {
          setSyncStatus("error"); setSyncMsg("Erro ao salvar: " + e.message);
        }
      }, []);

      // Debounced auto-sync
      const scheduleSync = (t, c, tg, h, m) => {
        clearTimeout(syncRef.current);
        syncRef.current = setTimeout(() => syncToGist(t, c, tg, h, m || mundos), 2000);
      };

      const updateTemas = (v) => { setTemas(v); lsSet(STORAGE_KEYS.temas, v); scheduleSync(v, cenarios, tags, historico, mundos); };
      const updateCenarios = (v) => { setCenarios(v); lsSet(STORAGE_KEYS.cenarios, v); scheduleSync(temas, v, tags, historico, mundos); };
      const updateTags = (v) => { setTags(v); lsSet(STORAGE_KEYS.tags, v); scheduleSync(temas, cenarios, v, historico, mundos); };
      const updateHistorico = (v) => { setHistorico(v); lsSet(STORAGE_KEYS.historico, v); scheduleSync(temas, cenarios, tags, v, mundos); };

      const handleSaveCfg = (newCfg) => {
        saveCfg(newCfg);
        setCfg(newCfg);
        setProvider(newCfg.provider || provider);
        // After saving config, push keys to Gist immediately
        if (newCfg.githubToken && newCfg.gistId) {
          syncFromGist();
          // Also write current state with new keys
          setTimeout(() => syncToGist(temas, cenarios, tags, historico, mundos), 500);
        }
      };

      const providerKey = provider === "deepseek" ? cfg.deepseekKey : cfg.anthropicKey;
      const providerOk = providerKey && providerKey.length > 10;

      // ── AI CALL ──────────────────────────────────────────────────────────────

      const processRawIdea = async () => {

${buildMasterContext()}

        try {

                    <div className="chip-grid">
                      {temas.map(t=>(
                        <div key={t.id} className={`chip ${tema===t.id?'active':''} ${t.uses>0?'unlocked':''}`} onClick={()=>setTema(tema===t.id?null:t.id)}>
                          {t.uses>0 && <span className="unlock-dot"/>}
                          {t.icon} {t.label} {t.uses>0 && <span className="use-count">{t.uses}x</span>}
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="section">
                    <div className="section-title">🗺 Cenário de Fundo</div>
                    <div className="chip-grid">
                      {cenarios.map(c=>(
                        <div key={c.id} className={`chip ${cenario===c.id?'active':''} ${c.uses>0?'unlocked':''}`} onClick={()=>setCenario(cenario===c.id?null:c.id)}>
                          {c.uses>0 && <span className="unlock-dot"/>}
                          {c.icon} {c.label} {c.uses>0 && <span className="use-count">{c.uses}x</span>}
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="section">
                    <div className="section-title">🔮 Tags Elementares</div>
                    <div className="tag-grid">
                      {tags.map(t=>(
                        <div key={t.id} className={`tag ${activeTags.includes(t.id)?'active':''} ${t.uses>0?'unlocked':''}`} onClick={()=>setActiveTags(p=>p.includes(t.id)?p.filter(x=>x!==t.id):[...p,t.id])}>
                          #{t.label} {t.uses>0 && <span style={{fontSize:".62rem",opacity:.5}}>({t.uses})</span>}
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="idea-area">
                    <div className="section-title">✍ Diretrizes Específicas (Opcional)</div>
                    <textarea className="idea-textarea" placeholder="Ex: Uma aventura investigativa para adaptar no Pathfinder 2e, focada em perícias..." value={dica} onChange={e=>setDica(e.target.value)}/>
                    {hasSel && (
                      <div className="idea-actions">
                        <span className="idea-hint" style={{margin:0}}>Inserir:</span>
                        {tObjSel && <button className="idea-quick-btn" onClick={()=>setDica(p=>p+(p?" ":"")+`Foque fortemente no tema de ${tObjSel.label}.`)}>+ {tObjSel.label}</button>}
                        {cObjSel && <button className="idea-quick-btn" onClick={()=>setDica(p=>p+(p?" ":"")+`A ambientação principal deve ser ${cObjSel.label}.`)}>+ {cObjSel.label}</button>}
                        {activeTags.map(id=>{const tg=tags.find(x=>x.id===id);return tg?(<button key={id} className="idea-quick-btn" onClick={()=>setDica(p=>p+(p?" ":"")+`Traga elementos de ${tg.label}.`)}>+ #{tg.label}</button>):null;})}
                        {dica && <button className="idea-quick-btn" style={{marginLeft:"auto",color:"var(--red)",borderColor:"rgba(192,96,64,.3)"}} onClick={()=>setDica("")}>Limpar</button>}
                      </div>
                    )}
                  </div>

                  <div className="generate-area">
                    <button className={`btn btn-primary ${loading?"loading":""}`} onClick={generateSeed} disabled={loading||!providerOk}>
                      {loading?"CONJURANDO RUNAS...":providerOk?"✦ FORJAR SEMENTE DE AVENTURA ✦":"⚙ Configure a chave de API primeiro"}
                    </button>
                  </div>

                  {justUnlocked && (
                    <div className="unlock-notice">✨ <div>Elemento incorporado ao Grimório: <strong>{justUnlocked.label}</strong></div></div>
                  )}

                  {resultado && (
                    <div className="result-box">
                      <div className="result-header">
                        <span className="result-label">Pergaminho Gerado</span>
                        <div className="result-badges">
                          {tObjSel && <span className="badge">{tObjSel.label}</span>}
                          {cObjSel && <span className="badge">{cObjSel.label}</span>}
                          <span className="badge" style={{opacity:.6}}>{provider==="deepseek"?"DeepSeek":"Claude"}</span>
                        </div>
                      </div>
                      <div className="result-content">{renderContent(resultado)}</div>
                      {sugestoes && (sugestoes.temas?.length>0||sugestoes.cenarios?.length>0||sugestoes.tags?.length>0) && (
                        <div className="ingested-preview">
                          <div className="ingested-title">✨ Elementos Descobertos nesta história</div>
                          <div className="ingested-items">
                            {sugestoes.temas?.map(t=><button key={t} className="btn btn-ingest" onClick={()=>ingestSuggestion('temas',t)}><span style={{opacity:.6,fontSize:".72rem"}}>[Tema]</span> + {t}</button>)}
                            {sugestoes.cenarios?.map(c=><button key={c} className="btn btn-ingest" onClick={()=>ingestSuggestion('cenarios',c)}><span style={{opacity:.6,fontSize:".72rem"}}>[Cenário]</span> + {c}</button>)}
                            {sugestoes.tags?.map(tg=><button key={tg} className="btn btn-ingest" onClick={()=>ingestSuggestion('tags',tg)}><span style={{opacity:.6,fontSize:".72rem"}}>[Tag]</span> + #{tg}</button>)}
                          </div>
                        </div>
                      )}
                      <div className="result-actions">
                        <button className="btn btn-ghost" onClick={()=>navigator.clipboard.writeText(resultado)}>⎘ Copiar</button>
                        <button className="btn btn-ghost" onClick={generateSeed} disabled={loading}>↺ Regerar</button>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* ── TAB IDEIAS ── */}
              {tab==="ideias" && (
                <div style={{display:"flex",flexDirection:"column",gap:"1.4rem"}}>
                  <div className="idea-area">
                    <div className="section-title">💡 Alquimia de Ideias Livres</div>
                    {activeMundo && (
                      <div style={{background:"rgba(200,151,58,.06)",border:"1px solid rgba(200,151,58,.2)",borderRadius:"4px",padding:".6rem .9rem",fontSize:".85rem",color:"var(--gold-dim)",marginBottom:"1rem"}}>
                        🌍 Mundo ativo: <strong style={{color:"var(--gold)"}}>{activeMundo.nome}</strong>
                      </div>
                    )}
                    <p style={{fontSize:".93rem",color:"var(--parchment-dim)",fontStyle:"italic",marginBottom:"1rem",lineHeight:1.65}}>
                      Cole qualquer texto — ideias, lore, referências, anotações. <strong style={{color:"var(--gold)"}}>Extrair Elementos</strong> salva temas, cenários e tags no grimório. <strong style={{color:"var(--gold)"}}>Gerar Seed</strong> transforma em aventura estruturada.
                    </p>
                    <textarea className="idea-textarea" style={{minHeight:"180px"}}
                      placeholder={"Ex: 'Uma cidade construída sobre as costas de uma criatura adormecida...' — ou referências a Dark Souls, Planescape, suas anotações de campanha..."}
                      value={ideiaCrua} onChange={e=>{setIdeiaCrua(e.target.value);setIdeiaExtraida(null);setIdeiaConfirmados([]);}}/>
                    <div style={{display:"flex",gap:".7rem",marginTop:"1rem",flexWrap:"wrap"}}>
                      <button className="btn btn-ingest" onClick={extrairDaIdeia} disabled={!ideiaCrua.trim()||ideiaExtraindo||!providerOk}>
                        {ideiaExtraindo ? "⚗ Analisando..." : "⚗ Extrair Elementos"}
                      </button>
                      <button className={`btn btn-primary ${loading?"loading":""}`} style={{padding:".6rem 1.6rem",fontSize:".88rem"}} onClick={processRawIdea} disabled={loading||!ideiaCrua.trim()||!providerOk}>
                        {loading ? "FORJANDO..." : "✦ Gerar Seed"}
                      </button>
                      {ideiaCrua && <button className="btn btn-ghost" style={{marginLeft:"auto"}} onClick={()=>{setIdeiaCrua("");setIdeiaExtraida(null);setIdeiaConfirmados([]);}}>Limpar</button>}
                    </div>
                  </div>

                  {ideiaExtraida && (
                    <div style={{background:"rgba(10,6,2,.7)",border:"1px solid rgba(200,151,58,.3)",borderRadius:"6px",padding:"1.6rem 2rem",animation:"fadeIn .4s ease"}}>
                      <div style={{fontFamily:"'Cinzel Decorative',serif",fontSize:".68rem",letterSpacing:".15em",color:"var(--gold)",textTransform:"uppercase",marginBottom:".8rem",display:"flex",alignItems:"center",gap:".6rem"}}>
                        Elementos Extraídos
                        <span style={{flex:1,height:"1px",background:"linear-gradient(to right,rgba(200,151,58,.35),transparent)"}}/>
                      </div>
                      {ideiaExtraida.resumo && (
                        <p style={{fontSize:".9rem",fontStyle:"italic",color:"var(--parchment-dim)",marginBottom:"1.3rem",lineHeight:1.5,borderLeft:"2px solid rgba(200,151,58,.3)",paddingLeft:".8rem"}}>
                          "{ideiaExtraida.resumo}"
                        </p>
                      )}
                      {["temas","cenarios","tags"].map(tipo => {
                        const items = ideiaExtraida[tipo] || [];
                        if (!items.length) return null;
                        const labels = {temas:"⚔ Temas", cenarios:"🗺 Cenários", tags:"🏷 Tags"};
                        const existsCheck = tipo==="temas" ? temas : tipo==="cenarios" ? cenarios : tags;
                        return (
                          <div key={tipo} style={{marginBottom:"1.2rem"}}>
                            <div style={{fontFamily:"'Cinzel Decorative',serif",fontSize:".6rem",letterSpacing:".12em",color:"var(--gold-dim)",textTransform:"uppercase",marginBottom:".6rem"}}>
                              {labels[tipo]} ({items.length})
                            </div>
                            <div style={{display:"flex",flexDirection: tipo==="tags"?"row":"column",flexWrap:"wrap",gap:".5rem"}}>
                              {items.map((item,i) => {
                                const id = item.label.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-');
                                const jaExiste = existsCheck.some(x=>x.id===id);
                                const confirmado = ideiaConfirmados.includes(id);
                                if (tipo === "tags") return (
                                  <div key={i} style={{display:"flex",alignItems:"center",gap:".4rem",background:"rgba(255,255,255,.02)",border:`1px solid ${confirmado?"rgba(64,192,128,.4)":"rgba(200,151,58,.15)"}`,borderRadius:"20px",padding:".28rem .8rem"}}>
                                    <span style={{fontSize:".88rem",color:confirmado?"var(--green)":"var(--parchment)"}}>{item.label}</span>
                                    {item.motivo && <span title={item.motivo} style={{fontSize:".7rem",color:"var(--parchment-dim)",cursor:"help",opacity:.7}}>ⓘ</span>}
                                    {jaExiste ? <span style={{fontSize:".7rem",color:"#5a4a30"}}>✓</span>
                                      : confirmado ? <span style={{fontSize:".72rem",color:"var(--green)"}}>✓</span>
                                      : <button style={{background:"transparent",border:"none",color:"var(--gold)",cursor:"pointer",fontSize:".85rem",padding:"0",lineHeight:1,fontWeight:700}} onClick={()=>confirmarElemento(tipo,item)}>+</button>}
                                  </div>
                                );
                                return (
                                  <div key={i} style={{display:"flex",alignItems:"center",gap:".8rem",background:"rgba(255,255,255,.02)",border:`1px solid ${confirmado?"rgba(64,192,128,.4)":"rgba(200,151,58,.15)"}`,borderRadius:"4px",padding:".55rem .9rem"}}>
                                    <span style={{fontSize:"1.2rem"}}>{item.icon}</span>
                                    <div style={{flex:1}}>
                                      <div style={{fontSize:".93rem",color:confirmado?"var(--green)":"var(--parchment)",fontWeight:600}}>{item.label}</div>
                                      {item.motivo && <div style={{fontSize:".78rem",color:"var(--parchment-dim)",fontStyle:"italic",marginTop:".1rem"}}>{item.motivo}</div>}
                                    </div>
                                    {jaExiste ? <span style={{fontSize:".72rem",color:"#5a4a30",fontStyle:"italic",whiteSpace:"nowrap"}}>já existe</span>
                                      : confirmado ? <span style={{fontSize:".78rem",color:"var(--green)",whiteSpace:"nowrap"}}>✓ Adicionado</span>
                                      : <button className="btn btn-ghost" style={{padding:".28rem .65rem",fontSize:".78rem",whiteSpace:"nowrap"}} onClick={()=>confirmarElemento(tipo,item)}>+ Adicionar</button>}
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        );
                      })}
                      {!ideiaExtraida.temas?.length && !ideiaExtraida.cenarios?.length && !ideiaExtraida.tags?.length && (
                        <p style={{fontStyle:"italic",color:"var(--parchment-dim)",fontSize:".9rem"}}>Nenhum elemento novo encontrado — todos já existem no grimório.</p>
                      )}
                      {(ideiaExtraida.temas?.length > 0 || ideiaExtraida.cenarios?.length > 0 || ideiaExtraida.tags?.length > 0) && (
                        <div style={{display:"flex",alignItems:"center",gap:".8rem",marginTop:"1.2rem",paddingTop:"1rem",borderTop:"1px solid rgba(200,151,58,.15)",flexWrap:"wrap"}}>
                          <button className="btn btn-primary" style={{padding:".6rem 1.6rem",fontSize:".88rem"}} onClick={confirmarTudo}>
                            ✓ Adicionar Todos ao Grimório
                          </button>
                          <span style={{fontSize:".82rem",color:"var(--parchment-dim)",fontStyle:"italic"}}>
                            {ideiaConfirmados.length > 0 ? ideiaConfirmados.length + " elemento(s) adicionado(s)" : "ou adicione um por um acima"}
                          </span>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )}

              {/* ── TAB MUNDOS ── */}
              {tab==="mundos" && (
                <div style={{display:"flex",flexDirection:"column",gap:"1.4rem"}}>
                  {editingMundo ? (
                    <div className="world-edit-form">
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"-.4rem"}}>
                        <span style={{fontFamily:"'Cinzel Decorative',serif",fontSize:".72rem",letterSpacing:".15em",color:"var(--gold)",textTransform:"uppercase"}}>
                          {isNewMundo ? "✦ Novo Mundo" : "✦ Editar Mundo"}
                        </span>
                        <button className="btn btn-ghost" style={{padding:".2rem .6rem",fontSize:".78rem"}} onClick={()=>{setEditingMundo(null);setIsNewMundo(false);}}>✕ Cancelar</button>
                      </div>
                      <div className="wf-row">
                        <label className="wf-label">Nome do Mundo *</label>
                        <input className="wf-input" placeholder="Ex: Forgotten Realms, Eberron, Westeros, Runeterra..." value={editingMundo.nome} onChange={e=>setEditingMundo(p=>({...p,nome:e.target.value}))}/>
                      </div>
                      <div className="wf-row">
                        <label className="wf-label">Descrição Geral</label>
                        <textarea className="wf-textarea" rows={2} placeholder="Uma frase ou parágrafo descrevendo a essência deste mundo..." value={editingMundo.descricao} onChange={e=>setEditingMundo(p=>({...p,descricao:e.target.value}))}/>
                      </div>
                      <div className="wf-section-label">Restrições</div>
                      <div className="wf-row">
                        <label className="wf-label">Restrições do Mundo</label>
                        <textarea className="wf-textarea" rows={2} placeholder="Ex: Sem magia arcana; tecnologia limitada a pólvora; mortos-vivos são controlados pela Igreja..." value={editingMundo.restricoes} onChange={e=>setEditingMundo(p=>({...p,restricoes:e.target.value}))}/>
                        <span className="wf-hint">⚠ Serão inseridas como obrigatórias no prompt de geração.</span>
                      </div>
                      <div className="wf-section-label">Conteúdo do Mundo</div>
                      <div className="wf-grid">
                        <div className="wf-row">
                          <label className="wf-label">Lore / História</label>
                          <textarea className="wf-textarea" rows={4} placeholder="Mitos de criação, eventos históricos, eras passadas..." value={editingMundo.lore} onChange={e=>setEditingMundo(p=>({...p,lore:e.target.value}))}/>
                        </div>
                        <div className="wf-row">
                          <label className="wf-label">Locais e Regiões</label>
                          <textarea className="wf-textarea" rows={4} placeholder="Cidades, dungeons, países, pontos de interesse..." value={editingMundo.locais} onChange={e=>setEditingMundo(p=>({...p,locais:e.target.value}))}/>
                        </div>
                        <div className="wf-row">
                          <label className="wf-label">Facções e Organizações</label>
                          <textarea className="wf-textarea" rows={4} placeholder="Guildas, impérios, cultos, ordens, alianças..." value={editingMundo.faccoes} onChange={e=>setEditingMundo(p=>({...p,faccoes:e.target.value}))}/>
                        </div>
                        <div className="wf-row">
                          <label className="wf-label">NPCs Importantes</label>
                          <textarea className="wf-textarea" rows={4} placeholder="Nomes, funções, motivações de personagens marcantes..." value={editingMundo.npcs} onChange={e=>setEditingMundo(p=>({...p,npcs:e.target.value}))}/>
                        </div>
                      </div>
                      <div style={{display:"flex",gap:".65rem",marginTop:".4rem",flexWrap:"wrap"}}>
                        <button className="btn btn-primary" style={{padding:".75rem 2rem",fontSize:".88rem"}} disabled={!editingMundo.nome.trim()} onClick={()=>saveMundo(editingMundo)}>
                          ✓ Salvar Mundo
                        </button>
                        {!isNewMundo && activeMundoId !== editingMundo.id && (
                          <button className="btn btn-ingest" onClick={()=>{setActiveMundoAndSave(editingMundo.id);setEditingMundo(null);setIsNewMundo(false);}}>
                            🌍 Ativar este Mundo
                          </button>
                        )}
                      </div>
                    </div>
                  ) : (
                    <>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:".6rem"}}>
                        <span style={{fontFamily:"'Cinzel Decorative',serif",fontSize:".65rem",letterSpacing:".15em",color:"var(--gold)",textTransform:"uppercase"}}>
                          {mundos.length} Mundo{mundos.length!==1?"s":""} Catalogado{mundos.length!==1?"s":""}
                        </span>
                        <button className="btn btn-ingest" onClick={()=>{setEditingMundo(EMPTY_MUNDO());setIsNewMundo(true);}}>
                          + Criar Novo Mundo
                        </button>
                      </div>
                      {activeMundo && (
                        <div className="world-active-bar">
                          <span className="world-active-label">🌍 Ativo</span>
                          <span className="world-name-display">{activeMundo.nome}</span>
                          <button className="btn btn-ghost" style={{padding:".25rem .7rem",fontSize:".8rem"}} onClick={()=>{setEditingMundo({...activeMundo});setIsNewMundo(false);}}>✏ Editar</button>
                          <button className="btn btn-ghost" style={{padding:".25rem .7rem",fontSize:".8rem",color:"#7a5040",borderColor:"rgba(180,80,40,.25)"}} onClick={()=>setActiveMundoAndSave(null)}>Desativar</button>
                        </div>
                      )}
                      {mundos.length === 0 ? (
                        <div className="empty-state">
                          <div style={{fontSize:"2rem",marginBottom:"1rem"}}>🗺️</div>
                          <p>Nenhum mundo criado ainda.</p>
                          <p style={{fontSize:".88rem",marginTop:".5rem"}}>Crie um mundo para contextualizar suas seeds — Forgotten Realms, seu cenário homebrew, ou qualquer ambientação.</p>
                        </div>
                      ) : (
                        <div className="world-list">
                          {mundos.map(m => (
                            <div key={m.id} className={`world-card ${activeMundoId===m.id?"active-world":""}`} onClick={()=>{setActiveMundoAndSave(m.id);}}>
                              <div className="world-card-info">
                                <div className="world-card-name">
                                  {activeMundoId===m.id && <span style={{fontSize:".62rem",marginRight:".4rem",verticalAlign:"middle"}}>🌍</span>}
                                  {m.nome}
                                </div>
                                {m.descricao && <div className="world-card-desc">{m.descricao}</div>}
                                <div className="world-card-meta">
                                  {m.lore && <span className="world-pill">📜 Lore</span>}
                                  {m.locais && <span className="world-pill">📍 Locais</span>}
                                  {m.faccoes && <span className="world-pill">⚔️ Facções</span>}
                                  {m.npcs && <span className="world-pill">👤 NPCs</span>}
                                  {m.restricoes && <span className="world-pill" style={{borderColor:"rgba(200,100,60,.35)",color:"#c08060"}}>⚠ Restrições</span>}
                                  <span className="world-pill" style={{opacity:.45}}>criado {m.criadoEm}</span>
                                </div>
                              </div>
                              <div className="world-card-actions" onClick={e=>e.stopPropagation()}>
                                <button className="btn btn-ghost" style={{padding:".3rem .7rem",fontSize:".82rem"}} onClick={()=>{setEditingMundo({...m});setIsNewMundo(false);}}>✏</button>
                                <button className="btn btn-ghost" style={{padding:".3rem .7rem",fontSize:".82rem",color:"#804030",borderColor:"rgba(180,60,40,.25)"}} onClick={()=>deleteMundo(m.id)}>🗑</button>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </>
                  )}

                  {activeMundo && !editingMundo && (
                    <div className="world-ingest-area">
                      <div className="world-ingest-title">💡 Ingerir Informação em "{activeMundo.nome}"</div>
                      <p style={{fontSize:".88rem",color:"var(--parchment-dim)",fontStyle:"italic",lineHeight:1.6}}>
                        Cole lore, descrições de sessão, notas de campanha, transcrições ou qualquer texto. A IA extrairá e organizará nas categorias do mundo automaticamente.
                      </p>
                      <textarea className="wf-textarea" rows={5}
                        placeholder="Ex: A cidade de Neverwinter foi reconstruída após o cataclismo de 1451 DR. O Senhor Protector Dagult Neverember governa com punho de ferro..."
                        value={mundoIngestText} onChange={e=>{setMundoIngestText(e.target.value);setMundoIngestResult(null);}}/>
                      {mundoIngestResult && !mundoIngestResult._error && (
                        <div style={{background:"rgba(200,151,58,.06)",border:"1px dashed rgba(200,151,58,.3)",borderRadius:"5px",padding:"1rem",display:"flex",flexDirection:"column",gap:".65rem"}}>
                          <span style={{fontFamily:"'Cinzel Decorative',serif",fontSize:".6rem",letterSpacing:".12em",color:"var(--gold)",textTransform:"uppercase"}}>Prévia — o que será adicionado</span>
                          {mundoIngestResult.resumo && <p style={{fontSize:".88rem",fontStyle:"italic",color:"var(--parchment-dim)"}}>{mundoIngestResult.resumo}</p>}
                          <div style={{display:"flex",flexWrap:"wrap",gap:".4rem"}}>
                            {mundoIngestResult.lore && <span style={{background:"rgba(200,151,58,.1)",border:"1px solid rgba(200,151,58,.25)",borderRadius:"3px",padding:".1rem .5rem",fontSize:".75rem",color:"var(--gold)"}}>📜 Lore</span>}
                            {mundoIngestResult.locais && <span style={{background:"rgba(200,151,58,.1)",border:"1px solid rgba(200,151,58,.25)",borderRadius:"3px",padding:".1rem .5rem",fontSize:".75rem",color:"var(--gold)"}}>📍 Locais</span>}
                            {mundoIngestResult.faccoes && <span style={{background:"rgba(200,151,58,.1)",border:"1px solid rgba(200,151,58,.25)",borderRadius:"3px",padding:".1rem .5rem",fontSize:".75rem",color:"var(--gold)"}}>⚔️ Facções</span>}
                            {mundoIngestResult.npcs && <span style={{background:"rgba(200,151,58,.1)",border:"1px solid rgba(200,151,58,.25)",borderRadius:"3px",padding:".1rem .5rem",fontSize:".75rem",color:"var(--gold)"}}>👤 NPCs</span>}
                            {mundoIngestResult.restricoes && <span style={{background:"rgba(200,151,58,.1)",border:"1px solid rgba(200,151,58,.25)",borderRadius:"3px",padding:".1rem .5rem",fontSize:".75rem",color:"#c08060"}}>⚠ Restrições</span>}
                          </div>
                          <div style={{display:"flex",gap:".5rem",flexWrap:"wrap"}}>
                            <button className="btn btn-primary" style={{padding:".6rem 1.6rem",fontSize:".88rem"}} onClick={applyMundoIngest}>✓ Confirmar e Adicionar</button>
                            <button className="btn btn-ghost" onClick={()=>setMundoIngestResult(null)}>Descartar</button>
                          </div>
                        </div>
                      )}
                      {mundoIngestResult?._error && <p style={{color:"var(--red)",fontStyle:"italic",fontSize:".88rem"}}>⚠ {mundoIngestResult._error}</p>}
                      {!mundoIngestResult && (
                        <div style={{display:"flex",gap:".6rem",flexWrap:"wrap"}}>
                          <button className="btn btn-ingest" disabled={!mundoIngestText.trim()||mundoIngestLoading||!providerOk} onClick={ingestIntoMundo}>
                            {mundoIngestLoading ? "Analisando…" : "🔮 Analisar e Organizar"}
                          </button>
                          {!providerOk && <span style={{fontSize:".82rem",fontStyle:"italic",color:"#7a5040",alignSelf:"center"}}>Configure a API nas ⚙ Configurações</span>}
                        </div>
                      )}
                    </div>
                  )}

                  {!activeMundo && !editingMundo && mundos.length > 0 && (
                    <div style={{background:"rgba(100,80,40,.06)",border:"1px solid rgba(150,110,50,.2)",borderRadius:"5px",padding:".9rem 1.1rem",fontSize:".88rem",color:"var(--parchment-dim)",fontStyle:"italic"}}>
                      Clique em um mundo para ativá-lo. O mundo ativo será usado como contexto em todas as seeds geradas.
                    </div>
                  )}
                </div>
              )}

              {/* ── TAB HISTÓRICO ── */}
              {tab==="historico" && (
                <div style={{display:"flex",flexDirection:"column",gap:"1rem"}}>
                  <div style={{display:"flex",gap:".6rem",alignItems:"center",flexWrap:"wrap"}}>
                    <select value={filtroMundoHist} onChange={e=>setFiltroMundoHist(e.target.value)}
                      style={{background:"rgba(0,0,0,.4)",border:"1px solid rgba(200,151,58,.25)",borderRadius:"4px",padding:".38rem .7rem",fontFamily:"'Crimson Pro',serif",fontSize:".88rem",color:"var(--parchment)",outline:"none",cursor:"pointer"}}>
                      <option value="">🌍 Todos os mundos</option>
                      <option value="__sem_mundo__">— Sem mundo vinculado</option>
                      {mundos.map(m=><option key={m.id} value={m.id}>{m.nome}</option>)}
                    </select>
                    <span style={{fontSize:".8rem",fontStyle:"italic",color:"var(--parchment-dim)"}}>{historicoFiltrado.length} seed(s)</span>
                    <div style={{marginLeft:"auto",display:"flex",gap:".5rem"}}>
                      {cfg.githubToken && cfg.gistId && (
                        <button className="btn btn-ghost" onClick={syncFromGist} disabled={syncStatus==="syncing"}>
                          {syncStatus==="syncing"?"↺ Sincronizando…":"↺ Sincronizar"}
                        </button>
                      )}
                    </div>
                  </div>

                  {historicoFiltrado.length===0 ? (
                    <p className="empty-state">{historico.length===0 ? "Nenhum pergaminho guardado ainda." : "Nenhuma seed para este filtro."}</p>
                  ) : (
                    <div className="history-list">
                      {historicoFiltrado.map(h => {
                        const titulo = h.text.split('\n').find(x=>x.startsWith('## '))?.replace('## ','')||"Aventura Sem Título";
                        const mundoVinculado = mundos.find(m=>m.id===h.mundoId);
                        const isExpanded = expandedHistId === h.id;
                        return (
                          <div key={h.id} style={{background:"var(--surface)",border:`1px solid ${mundoVinculado?"rgba(200,151,58,.35)":"var(--border)"}`,borderRadius:"5px",overflow:"hidden",transition:"all .2s"}}>
                            <div style={{padding:"1rem 1.2rem",cursor:"pointer"}} onClick={()=>setExpandedHistId(isExpanded?null:h.id)}>
                              <div style={{display:"flex",gap:".35rem",flexWrap:"wrap",marginBottom:".4rem",alignItems:"center"}}>
                                {mundoVinculado && <span style={{background:"rgba(200,151,58,.12)",border:"1px solid rgba(200,151,58,.3)",borderRadius:"3px",padding:".1rem .45rem",fontSize:".7rem",color:"var(--gold)"}}>🌍 {mundoVinculado.nome}</span>}
                                {h.tema && <span className="badge">{h.tema}</span>}
                                {h.cenario && <span className="badge">{h.cenario}</span>}
                                {h.provider && <span className="badge" style={{opacity:.5}}>{h.provider}</span>}
                                <span style={{marginLeft:"auto",fontSize:".72rem",color:"#5a4a30"}}>{isExpanded?"▲":"▼"}</span>
                              </div>
                              <div style={{fontSize:".93rem",color:"var(--parchment-dim)",fontStyle:"italic",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{titulo}</div>
                              <div style={{fontSize:".75rem",color:"#5a4a30",marginTop:".3rem"}}>Forjado em: {h.date}</div>
                            </div>
                            {isExpanded && (
                              <div style={{borderTop:"1px solid rgba(200,151,58,.15)",padding:"1rem 1.2rem",display:"flex",flexDirection:"column",gap:".8rem",background:"rgba(0,0,0,.2)"}}>
                                <div style={{display:"flex",alignItems:"center",gap:".6rem",flexWrap:"wrap"}}>
                                  <span style={{fontSize:".8rem",color:"var(--parchment-dim)",whiteSpace:"nowrap"}}>Vincular ao mundo:</span>
                                  <select value={h.mundoId||""} onChange={e=>vincularSeedMundo(h.id, e.target.value||null)}
                                    style={{background:"rgba(0,0,0,.4)",border:"1px solid rgba(200,151,58,.25)",borderRadius:"4px",padding:".3rem .6rem",fontFamily:"'Crimson Pro',serif",fontSize:".85rem",color:"var(--parchment)",outline:"none",cursor:"pointer",flex:1,minWidth:"140px"}}>
                                    <option value="">— Nenhum —</option>
                                    {mundos.map(m=><option key={m.id} value={m.id}>{m.nome}</option>)}
                                  </select>
                                </div>
                                {mundoVinculado && (
                                  <div style={{background:"rgba(200,151,58,.05)",border:"1px dashed rgba(200,151,58,.25)",borderRadius:"4px",padding:".7rem .9rem",display:"flex",alignItems:"center",gap:".8rem",flexWrap:"wrap"}}>
                                    <div style={{flex:1}}>
                                      <div style={{fontSize:".82rem",color:"var(--gold)",fontWeight:600,marginBottom:".2rem"}}>Incorporar ao lore de "{mundoVinculado.nome}"</div>
                                      <div style={{fontSize:".78rem",color:"var(--parchment-dim)",fontStyle:"italic"}}>A IA extrai NPCs, locais e eventos desta seed e adiciona ao mundo.</div>
                                    </div>
                                    <button className="btn btn-ingest" style={{whiteSpace:"nowrap",padding:".4rem .9rem",fontSize:".82rem"}} disabled={incorporandoId===h.id} onClick={()=>incorporarSeedNoMundo(h, mundoVinculado)}>
                                      {incorporandoId===h.id ? "⚗ Incorporando..." : "⚗ Incorporar"}
                                    </button>
                                  </div>
                                )}
                                <div style={{display:"flex",gap:".5rem",flexWrap:"wrap"}}>
                                  <button className="btn btn-ghost" style={{fontSize:".82rem",padding:".32rem .8rem"}} onClick={()=>{setResultado(h.text);setTab("gerar");setSugestoes(null);setExpandedHistId(null);}}>📖 Abrir seed</button>
                                  <button className="btn btn-ghost" style={{fontSize:".82rem",padding:".32rem .8rem"}} onClick={()=>navigator.clipboard.writeText(h.text)}>⎘ Copiar</button>
                                  <button className="btn btn-danger" style={{fontSize:".82rem",padding:".32rem .8rem",marginLeft:"auto"}} onClick={()=>deletarSeed(h.id)}>🗑 Apagar</button>
                                </div>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}

              {/* ── TAB BIBLIOTECA ── */}
              {tab==="biblioteca" && (
                <div style={{display:"flex",flexDirection:"column",gap:"1.4rem"}}>
                  <div className="stats-grid">
                    <div className="stat-card"><div className="stat-num">{temas.length}</div><div className="stat-label">Temas Conhecidos</div></div>
                    <div className="stat-card"><div className="stat-num">{cenarios.length}</div><div className="stat-label">Cenários Catalogados</div></div>
                    <div className="stat-card"><div className="stat-num">{tags.length}</div><div className="stat-label">Tags Coletadas</div></div>
                    <div className="stat-card"><div className="stat-num">{historico.length}</div><div className="stat-label">Seeds Forjadas</div></div>
                  </div>
                  <div className="section">
                    <div className="section-title">📊 Temas mais Conjurados</div>
                    {[...temas].sort((a,b)=>b.uses-a.uses).filter(t=>t.uses>0).slice(0,5).map(t=>(
                      <div key={t.id} style={{display:"flex",justifyContent:"space-between",padding:".4rem 0",borderBottom:"1px solid rgba(200,151,58,.15)",fontSize:".93rem"}}>
                        <span>{t.icon} {t.label}</span><span style={{color:"var(--gold)"}}>{t.uses}×</span>
                      </div>
                    ))}
                    {!temas.some(t=>t.uses>0) && <p className="empty-state" style={{padding:"1rem 0"}}>Nenhum tema usado ainda.</p>}
                  </div>
                  <div className="section">
                    <div className="section-title">🏷 Tags de Maior Afinidade</div>
                    {[...tags].sort((a,b)=>b.uses-a.uses).filter(t=>t.uses>0).slice(0,8).map(t=>(
                      <div key={t.id} style={{display:"flex",justifyContent:"space-between",padding:".4rem 0",borderBottom:"1px solid rgba(200,151,58,.15)",fontSize:".93rem"}}>
                        <span>#{t.label}</span><span style={{color:"var(--gold)"}}>{t.uses}×</span>
                      </div>
                    ))}
                    {!tags.some(t=>t.uses>0) && <p className="empty-state" style={{padding:"1rem 0"}}>Nenhuma tag usada ainda.</p>}
                  </div>
                  <div style={{textAlign:"center",paddingTop:".8rem"}}>
                    <button className="btn btn-danger" onClick={resetAll}>⚠ Limpar Registro das Runas</button>
                  </div>
                </div>
              )}

            </div>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
